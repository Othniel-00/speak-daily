<!doctype html>
<html lang="en" data-phase="morning">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speak Daily</title>
  <meta name="description" content="Your daily morning and evening speaking, grammar and reading coach.">
  <meta name="theme-color" content="#E7F0EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Speak Daily">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Set the time-of-day theme before first paint.
    (function () { var h = new Date().getHours(); document.documentElement.dataset.phase = h >= 4 && h < 16 ? 'morning' : 'evening'; })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6Z" fill="currentColor"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4.5 15.5 20l-3.2-6.3z" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5.5 6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M3.5 5.5c3-.9 6-.6 8.5 1.2v13c-2.5-1.8-5.5-2.1-8.5-1.2zM20.5 5.5c-3-.9-6-.6-8.5 1.2v13c2.5-1.8 5.5-2.1 8.5-1.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 19.5V12M10 19.5V6M15 19.5v-9M20 19.5V9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 12.5h1.5M11 9.5v6M14 10.5v4M17 12.5h-.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6A3.8 3.8 0 0 1 17.5 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8Z" fill="currentColor"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7l4-3.5L16 7M6.5 11H5v9.5h14V11h-1.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Speak Daily</span>
      <button class="icon-btn" data-action="settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <button data-action="tab" data-tab="today"><svg class="ic"><use href="#i-home"/></svg><span>Today</span></button>
    <button data-action="tab" data-tab="read"><svg class="ic"><use href="#i-book"/></svg><span>Read</span></button>
    <button data-action="tab" data-tab="coach"><svg class="ic"><use href="#i-chat"/></svg><span>Coach</span></button>
    <button data-action="tab" data-tab="progress"><svg class="ic"><use href="#i-chart"/></svg><span>Progress</span></button>
  </nav>

  <div id="overlay"></div>
  <div id="toast" role="status" hidden></div>
  <noscript>Speak Daily needs JavaScript turned on.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
